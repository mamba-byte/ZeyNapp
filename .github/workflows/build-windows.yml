# Windows .exe'yi GitHub'ın Windows sunucusunda otomatik derler.
#  - Her push / pull request'te derler ve exe'yi "Artifacts" olarak ekler.
#  - "v1.0.0" gibi bir etiket (tag) gönderildiğinde exe'yi bir GitHub Release'e yükler.
#  - Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir.
name: Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Python 3.13 kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Tek dosya exe derle
        env:
          MV3D_ONEDIR: '0'
        run: python -m PyInstaller --noconfirm --clean ModelViewer3D.spec

      - name: Duman testi (her görüntüleme modunda örnek model aç + ekran görüntüsü al)
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          # Chromium'un kendi hata mesajları (ör. ölümcül CHECK) stderr'e yazılsın
          QTWEBENGINE_CHROMIUM_FLAGS: '--enable-logging=stderr --log-level=0'
        run: |
          python tools/make_test_models.py samples
          New-Item -ItemType Directory -Force smoke | Out-Null
          $failed = @()
          foreach ($mode in 'auto', 'compat', 'software', 'nogpu') {
            Write-Host "::group::Duman testi - mod: $mode"
            $out = "smoke\$mode"
            $p = Start-Process -FilePath "dist\ModelViewer3D.exe" -PassThru `
                   -ArgumentList 'samples\animated.glb', '--capture', "$out.png", '--render-mode', $mode, '--profile', "ci-$mode" `
                   -RedirectStandardOutput "$out.stdout.txt" -RedirectStandardError "$out.stderr.txt"
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host 'ZAMAN AŞIMI (150 sn)' }
            $code = $p.ExitCode
            Write-Host ("Çıkış kodu: {0} (0x{0:X8})" -f $code)
            Write-Host '--- stderr (son 120 satır) ---'
            Get-Content "$out.stderr.txt" -Tail 120 -ErrorAction SilentlyContinue
            if (Test-Path "$out.png") { Write-Host "BAŞARILI: $out.png" } else { Write-Host 'BAŞARISIZ: ekran görüntüsü yok'; $failed += $mode }
            Write-Host '::endgroup::'
          }
          Write-Host '::group::Uygulama günlükleri (viewer.log / crash.log)'
          Copy-Item "$env:LOCALAPPDATA\ModelViewer3D\*.log" smoke\ -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\ModelViewer3D\viewer.log" -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\ModelViewer3D\crash.log" -ErrorAction SilentlyContinue
          Write-Host '::endgroup::'
          if ($failed.Count) { throw "Duman testi başarısız modlar: $($failed -join ', ')" }

      - name: Exe'yi yükle (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: ModelViewer3D-windows
          path: dist/ModelViewer3D.exe
          if-no-files-found: error

      - name: Duman testi çıktılarını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duman-testi-loglari
          path: smoke/
          if-no-files-found: ignore

      - name: Release oluştur (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ModelViewer3D.exe
          generate_release_notes: true
